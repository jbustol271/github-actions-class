name: e2e-v1

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  e2eTests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Run needed containers
        run: |
          # API
          docker run -d -p 3001:3000 ghcr.io/jbustol271/hangman-api-cep-grupo-a:latest

          # FRONTEND
          docker run -d -p 8080:8080 \
            -e API_URL=http://localhost:3001 \
            ghcr.io/jbustol271/hangman-frontend-cep-grupo-a:latest

      - name: Install dependencies
        run: npm ci
        working-directory: ./hangman-e2e/e2e

      - name: Execute e2e tests
        uses: cypress-io/github-action@v7
        with:
          working-directory: ./hangman-e2e/e2e
