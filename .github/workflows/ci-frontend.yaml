name: Frontend Integración continua

on:
  push:
    branches: [ main ]
    paths: [ 'hangman-front/**' ]
  
  pull_request:
    branches: [ main ]
    paths: [ 'hangman-front/**' ]


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Build
        working-directory: ./hangman-front
        run: |
          npm ci 
          npm run build --if-present

  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Unit test
        working-directory: ./hangman-front
        run: |
          npm ci 
          npm run test

  bye:
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Bye 
        run: echo 'bye'