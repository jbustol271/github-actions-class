name: e2e

on:
  workflow_dispatch:

  

jobs:
  e2eTests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Run needed containers
        run: |
          docker run -d -p 3001:3000 jbustol271/hangman-api-cep-grupo-a
          docker run -d -p 8080:8080 -e API_URL=http://localhost:3001 jbustol271/hangman-front-cep-grupo-a
      - name: Install dependencies
        run: npm ci
        working-directory: ./hangman-e2e/e2e
      - name: Execute e2e tests
        uses: cypress-io/github-action@v7
        with:
          working-directory: ./hangman-e2e/e2e